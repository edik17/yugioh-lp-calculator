<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="112" fill="#060911"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#f5b731" stroke-width="6" opacity="0.4"/>
  <circle cx="256" cy="256" r="200" fill="none" stroke="#00d2ff" stroke-width="3" opacity="0.3"/>
  <defs>
    <linearGradient id="goldGradIcon" x1="0" y1="0" x2="512" y2="512">
      <stop offset="0%" stop-color="#ffe27a"/>
      <stop offset="50%" stop-color="#f5b731"/>
      <stop offset="100%" stop-color="#b87a08"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Millennium Eye Pyramid -->
  <polygon points="256,70 436,410 76,410" stroke="url(#goldGradIcon)" stroke-width="24" fill="rgba(245,183,49,0.12)" filter="url(#glow)"/>
  <ellipse cx="256" cy="285" rx="75" ry="46" stroke="url(#goldGradIcon)" stroke-width="18" fill="none"/>
  <circle cx="256" cy="285" r="24" fill="#f5b731"/>
</svg>
